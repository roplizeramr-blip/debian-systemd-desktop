; Supervisor is PID 1 in this image.  It is intentionally named "systemd"
; in the container command so /proc/1/comm matches the compatibility layer.
[unix_http_server]
file=/run/supervisor.sock
chmod=0770
chown=root:desktop

[supervisord]
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/run/supervisord.pid
nodaemon=true
user=root
umask=022
childlogdir=/var/log/supervisor
minfds=1024
minprocs=200
strip_ansi=true
environment=PYTHONUNBUFFERED="1"

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf

[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
priority=15
autostart=true
autorestart=true
startsecs=1
startretries=10
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/dbus.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/dbus.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2

[program:systemd-journald]
command=/usr/bin/python3 /opt/systemd-compat/systemd-journald.py
priority=10
autostart=true
autorestart=true
startsecs=1
startretries=10
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/systemd-journald.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/systemd-journald.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2

[program:systemd-dbus]
command=/usr/bin/python3 /opt/systemd-compat/systemd_dbus.py
priority=20
autostart=true
autorestart=true
startsecs=1
startretries=20
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/systemd-dbus.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/systemd-dbus.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2

; Userspace OOM protection for the 2 GiB desktop.  It prefers killing a
; memory-hungry browser tab over losing Xvnc/XFCE, and never touches the
; window manager or the process supervisor.
[program:earlyoom]
command=/usr/bin/earlyoom -m 4 -s 1 -r 60 --avoid 'Xvnc|Xorg|xfwm4|xfdesktop|xfce4-panel|xfsettingsd|supervisord|dbus-daemon'
priority=25
autostart=true
autorestart=true
startsecs=1
startretries=10
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/earlyoom.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/earlyoom.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2

[program:xvnc]
command=/usr/local/bin/start-xvnc.sh
user=desktop
priority=30
autostart=true
autorestart=true
startsecs=1
startretries=10
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
environment=DISPLAY=":1",HOME="/home/desktop",USER="desktop",LOGNAME="desktop",XDG_RUNTIME_DIR="/run/user/1000"
stdout_logfile=/var/log/supervisor/xvnc.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/xvnc.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2

[program:xfce]
command=/usr/local/bin/start-xfce.sh
user=desktop
priority=40
autostart=true
autorestart=true
startsecs=2
startretries=10
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
environment=DISPLAY=":1",HOME="/home/desktop",USER="desktop",LOGNAME="desktop",XDG_RUNTIME_DIR="/run/user/1000",XDG_SESSION_TYPE="x11",XDG_CURRENT_DESKTOP="XFCE",XDG_SESSION_DESKTOP="xfce"
stdout_logfile=/var/log/supervisor/xfce.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/xfce.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2

[program:novnc]
command=/usr/local/bin/start-novnc.sh
user=desktop
priority=50
autostart=true
autorestart=true
startsecs=1
startretries=10
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
environment=HOME="/home/desktop",USER="desktop",LOGNAME="desktop"
stdout_logfile=/var/log/supervisor/novnc.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/novnc.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2


