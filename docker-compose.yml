services:
  desktop:
    build:
      context: .
      dockerfile: Dockerfile
    image: ubuntu-systemd-desktop:local
    container_name: ubuntu-systemd-desktop
    hostname: ubuntu-desktop
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "3000:3000"
    shm_size: "1gb"
    environment:
      NOVNC_PORT: "${NOVNC_PORT:-3000}"
      VNC_PORT: "${VNC_PORT:-5901}"
      VNC_RESOLUTION: "${VNC_RESOLUTION:-1440x900}"
      VNC_PW: "${VNC_PW:-Ubuntu26}"
      VNC_FRAME_RATE: "${VNC_FRAME_RATE:-30}"
      VNC_COMPARE_FB: "${VNC_COMPARE_FB:-2}"
      VNC_ZLIB_LEVEL: "${VNC_ZLIB_LEVEL:-1}"
      VNC_COMPRESS_LEVEL: "${VNC_COMPRESS_LEVEL:-1}"
      VNC_QUALITY: "${VNC_QUALITY:-8}"
      SWAP_ENABLED: "${SWAP_ENABLED:-1}"
      SWAP_SIZE_MB: "${SWAP_SIZE_MB:-6144}"
      SWAP_SPARSE: "${SWAP_SPARSE:-0}"
      TZ: "${TZ:-Africa/Cairo}"
      SYSTEMD_DETECT_VIRT: "${SYSTEMD_DETECT_VIRT:-none}"
      HIDE_CONTAINER: "${HIDE_CONTAINER:-0}"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 8s
      start_period: 45s
      retries: 3
