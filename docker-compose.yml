services:
  desktop:
    build:
      context: .
      dockerfile: Dockerfile
    image: ubuntu-systemd-desktop:local
    container_name: ubuntu-systemd-desktop
    hostname: ubuntu-desktop
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "3000:3000"
    shm_size: "1gb"
    environment:
      NOVNC_PORT: "3000"
      VNC_PORT: "5901"
      VNC_RESOLUTION: "1440x900"
      VNC_PW: "Ubuntu26"
      TZ: "Africa/Cairo"
      SYSTEMD_DETECT_VIRT: "none"
      HIDE_CONTAINER: "0"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 8s
      start_period: 45s
      retries: 3
